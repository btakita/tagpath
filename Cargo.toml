[package]
name = "tagpath"
version = "0.12.1"
edition = "2024"
description = "Tag Path — parse, lint, and search tag-based identifiers across languages"
license = "MIT"
repository = "https://github.com/btakita/tagpath"
keywords = ["naming", "convention", "identifier", "parser", "lint"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [".", "crates/tagpath-core"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tagpath"
path = "src/main.rs"
required-features = ["treesitter"]

[features]
default = ["lang-rust", "lang-python", "lang-javascript", "lang-typescript", "lang-go", "lang-c", "lang-cpp", "lang-java", "lang-ruby", "lang-php", "lang-csharp", "lang-swift", "lang-kotlin", "mcp", "watch"]
mcp = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]
treesitter = ["dep:tree-sitter"]
# Filesystem-watching NDJSON stream (`tagpath watch`). Native-only; not
# available on wasm builds.
watch = ["dep:notify", "dep:libc"]
lang-rust = ["treesitter", "dep:tree-sitter-rust"]
lang-python = ["treesitter", "dep:tree-sitter-python"]
lang-javascript = ["treesitter", "dep:tree-sitter-javascript"]
lang-typescript = ["treesitter", "dep:tree-sitter-typescript"]
lang-go = ["treesitter", "dep:tree-sitter-go"]
lang-c = ["treesitter", "dep:tree-sitter-c"]
lang-cpp = ["treesitter", "dep:tree-sitter-cpp"]
lang-java = ["treesitter", "dep:tree-sitter-java"]
lang-ruby = ["treesitter", "dep:tree-sitter-ruby"]
lang-php = ["treesitter", "dep:tree-sitter-php"]
lang-csharp = ["treesitter", "dep:tree-sitter-c-sharp"]
lang-swift = ["treesitter", "dep:tree-sitter-swift"]
lang-kotlin = ["treesitter", "dep:tree-sitter-kotlin-ng"]
# Runtime tree-sitter grammar loading from `.so` / `.dylib` / `.dll` files (native only).
# Opt-in; not part of `default`. WASM builds must NOT enable this feature.
dyn-grammar = ["treesitter", "dep:libloading", "dep:tree-sitter-language"]

[dependencies]
tagpath-core = { version = "=0.12.1", path = "crates/tagpath-core" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
toml = "0.8"
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
petgraph = "0.8"
walkdir = "2"
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
libloading = { version = "0.8", optional = true }
tree-sitter-language = { version = "0.1", optional = true }
dirs = "5"
notify = { version = "6", optional = true }
libc = { version = "0.2", optional = true }
